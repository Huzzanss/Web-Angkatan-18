<!DOCTYPE html>
<html class="dark" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Angkatan 18</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #4edea3;
            --primary-dark: #10b981;
            --surface: #101413;
            --surface-light: #181c1b;
            --surface-lighter: #272b2a;
            --text-primary: #F9FAFB;
            --text-secondary: #9CA3AF;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--surface);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
        }

        .glass-effect {
            background: rgba(13, 22, 18, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(78, 222, 163, 0.15);
        }

        .btn-primary {
            background: var(--primary);
            color: #003824;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: #38c48f;
            transform: translateY(-2px);
            box-shadow: 0 4px 24px rgba(78, 222, 163, 0.3);
        }

        .btn-secondary {
            background: var(--surface-lighter);
            color: var(--text-primary);
            padding: 8px 16px;
            border: 1px solid #3c4a42;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: #313634;
            border-color: var(--primary);
        }

        .input-field {
            width: 100%;
            background: var(--surface-light);
            border: 1px solid #3c4a42;
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(78, 222, 163, 0.1);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface-light);
            border: 1px solid #3c4a42;
            border-radius: 12px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" class="page active h-screen flex items-center justify-center">
        <div class="glass-effect rounded-xl p-8 w-full" style="max-width: 400px;">
            <div style="text-align: center; margin-bottom: 32px;">
                <h1 style="font-size: 28px; font-weight: 700; margin: 0 0 8px 0;">Admin Panel</h1>
                <p style="color: var(--text-secondary); margin: 0;">Angkatan 18 • SMP Islam Bunga Bangsa</p>
            </div>

            <form id="loginForm" style="display: flex; flex-direction: column; gap: 16px;">
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: var(--text-secondary);">Admin ID</label>
                    <input type="text" class="input-field" id="adminId" placeholder="Masukkan Admin ID" required>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: var(--text-secondary);">Password</label>
                    <input type="password" class="input-field" id="password" placeholder="Masukkan Password" required>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; font-size: 16px; padding: 12px;">
                    <span class="material-symbols-outlined">login</span>
                    Masuk ke Admin
                </button>
            </form>

            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #3c4a42; text-align: center; color: var(--text-secondary); font-size: 12px;">
                <p style="margin: 0;"><strong>Default:</strong> admin / Angkatan18!</p>
                <p style="margin: 8px 0 0 0; color: var(--warning);">⚠️ Ubah password setelah login</p>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardPage" class="page">
        <!-- Header -->
        <header style="background: var(--surface-light); border-bottom: 1px solid #3c4a42; padding: 20px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 style="margin: 0; font-size: 24px; font-weight: 700;">Admin Dashboard</h1>
                <p style="margin: 4px 0 0 0; color: var(--text-secondary); font-size: 14px;">Angkatan 18</p>
            </div>
            <button id="logoutBtn" class="btn-secondary">
                <span class="material-symbols-outlined" style="font-size: 20px;">logout</span>
                Logout
            </button>
        </header>

        <!-- Content -->
        <div style="max-width: 1200px; margin: 0 auto; padding: 32px 20px;">
            <!-- Stats -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 32px;">
                <div class="glass-effect rounded-lg p-6" style="text-align: center;">
                    <div style="font-size: 32px; font-weight: 700; color: var(--primary); margin-bottom: 8px;">79</div>
                    <p style="margin: 0; color: var(--text-secondary); font-size: 14px;">Total Siswa</p>
                </div>
                <div class="glass-effect rounded-lg p-6" style="text-align: center;">
                    <div style="font-size: 32px; font-weight: 700; color: #38BDF8; margin-bottom: 8px;">37</div>
                    <p style="margin: 0; color: var(--text-secondary); font-size: 14px;">Putra (Ikhwan)</p>
                </div>
                <div class="glass-effect rounded-lg p-6" style="text-align: center;">
                    <div style="font-size: 32px; font-weight: 700; color: #F472B6; margin-bottom: 8px;">42</div>
                    <p style="margin: 0; color: var(--text-secondary); font-size: 14px;">Putri (Akhwat)</p>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="glass-effect rounded-lg p-6" style="border: 1px solid #3c4a42;">
                <h3 style="margin-top: 0; margin-bottom: 20px; font-size: 18px; font-weight: 600;">Aksi Cepat</h3>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <button id="changePwdBtn" class="btn-primary" style="width: 100%; justify-content: flex-start; padding: 12px;">
                        <span class="material-symbols-outlined">lock</span>
                        Ubah Password Admin
                    </button>
                    <button id="viewStudentsBtn" class="btn-primary" style="width: 100%; justify-content: flex-start; padding: 12px;">
                        <span class="material-symbols-outlined">group</span>
                        Lihat Daftar Siswa
                    </button>
                </div>
            </div>

            <!-- Change Password Modal -->
            <div id="passwordModal" class="modal">
                <div class="modal-content">
                    <h2 style="margin-top: 0; margin-bottom: 20px; font-size: 20px; font-weight: 700;">Ubah Password</h2>
                    <form id="passwordForm" style="display: flex; flex-direction: column; gap: 16px;">
                        <div>
                            <label style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text-secondary);">Password Lama</label>
                            <input type="password" class="input-field" id="oldPassword" placeholder="Masukkan password lama" required>
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text-secondary);">Password Baru</label>
                            <input type="password" class="input-field" id="newPassword" placeholder="Min. 8 karakter" required>
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text-secondary);">Konfirmasi Password</label>
                            <input type="password" class="input-field" id="confirmPassword" placeholder="Konfirmasi password baru" required>
                        </div>
                        <div style="display: flex; gap: 12px;">
                            <button type="submit" class="btn-primary" style="flex: 1;">Simpan</button>
                            <button type="button" class="btn-secondary" onclick="closePasswordModal()" style="flex: 1;">Batal</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Notifications -->
    <div id="notificationsContainer" style="position: fixed; top: 20px; right: 20px; z-index: 2000;"></div>

    <script>
        const adminCredentials = {
            username: 'admin',
            password: 'Angkatan18!'
        };

        let isAuthenticated = false;

        document.getElementById('loginForm').addEventListener('submit', handleLogin);
        document.getElementById('logoutBtn').addEventListener('click', handleLogout);
        document.getElementById('changePwdBtn').addEventListener('click', openPasswordModal);
        document.getElementById('passwordForm').addEventListener('submit', handlePasswordChange);

        function handleLogin(e) {
            e.preventDefault();
            const adminId = document.getElementById('adminId').value;
            const password = document.getElementById('password').value;

            if (adminId === adminCredentials.username && password === adminCredentials.password) {
                isAuthenticated = true;
                document.getElementById('loginPage').classList.remove('active');
                document.getElementById('dashboardPage').classList.add('active');
                showNotification('Login berhasil!', 'success');
            } else {
                showNotification('Admin ID atau Password salah!', 'error');
            }
        }

        function handleLogout() {
            isAuthenticated = false;
            document.getElementById('loginForm').reset();
            document.getElementById('dashboardPage').classList.remove('active');
            document.getElementById('loginPage').classList.add('active');
            showNotification('Anda telah logout', 'success');
        }

        function openPasswordModal() {
            document.getElementById('passwordModal').classList.add('active');
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.remove('active');
            document.getElementById('passwordForm').reset();
        }

        function handlePasswordChange(e) {
            e.preventDefault();
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (oldPassword !== adminCredentials.password) {
                showNotification('Password lama tidak sesuai!', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showNotification('Password baru tidak cocok!', 'error');
                return;
            }

            if (newPassword.length < 8) {
                showNotification('Password minimal 8 karakter!', 'error');
                return;
            }

            adminCredentials.password = newPassword;
            showNotification('Password berhasil diperbarui!', 'success');
            closePasswordModal();
        }

        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.style.padding = '16px 20px';
            notification.style.borderRadius = '8px';
            notification.style.fontWeight = '500';
            notification.style.minWidth = '300px';
            notification.style.animation = 'slideIn 0.3s ease';
            
            if (type === 'success') {
                notification.style.background = var(--success);
                notification.style.color = 'white';
            } else {
                notification.style.background = var(--danger);
                notification.style.color = 'white';
            }
            
            notification.textContent = message;
            document.getElementById('notificationsContainer').appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        document.getElementById('passwordModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closePasswordModal();
            }
        });
    </script>
</body>
</html>
