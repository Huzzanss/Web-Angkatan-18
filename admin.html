<!DOCTYPE html>
<html class="dark" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Angkatan 18</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet">
    <link href="admin-styles.css" rel="stylesheet">
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" class="page active h-screen flex items-center justify-center">
        <div class="glass-effect rounded-xl p-8 w-full" style="max-width: 400px;">
            <div style="text-align: center; margin-bottom: 32px;">
                <h1 style="font-size: 28px; font-weight: 700; margin: 0 0 8px 0;">Admin Panel</h1>
                <p style="color: var(--text-secondary); margin: 0;">Angkatan 18 • SMP Islam Bunga Bangsa</p>
            </div>

            <form id="loginForm" style="display: flex; flex-direction: column; gap: 16px;">
                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: var(--text-secondary);">Admin ID</label>
                    <input type="text" class="input-field" id="adminId" placeholder="Masukkan Admin ID" required>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: var(--text-secondary);">Password</label>
                    <input type="password" class="input-field" id="password" placeholder="Masukkan Password" required>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; font-size: 16px; padding: 12px;">
                    <span class="material-symbols-outlined">login</span>
                    Masuk ke Admin
                </button>
            </form>

            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #3c4a42; text-align: center; color: var(--text-secondary); font-size: 12px;">
                <p style="margin: 0;"><strong>Default:</strong> admin / Angkatan18!</p>
                <p style="margin: 8px 0 0 0; color: var(--warning);">⚠️ Ubah password setelah login</p>
            </div>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardPage" class="page">
        <!-- Header -->
        <header style="background: var(--surface-light); border-bottom: 1px solid #3c4a42; padding: 20px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 style="margin: 0; font-size: 24px; font-weight: 700;">Admin Dashboard</h1>
                <p style="margin: 4px 0 0 0; color: var(--text-secondary); font-size: 14px;">Angkatan 18</p>
            </div>
            <button id="logoutBtn" class="btn-secondary">
                <span class="material-symbols-outlined" style="font-size: 20px;">logout</span>
                Logout
            </button>
        </header>

        <!-- Content -->
        <div style="max-width: 1200px; margin: 0 auto; padding: 32px 20px;">
            <!-- Stats -->
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 32px;">
                <div class="glass-effect rounded-lg p-6" style="text-align: center;">
                    <div style="font-size: 32px; font-weight: 700; color: var(--primary); margin-bottom: 8px;">79</div>
                    <p style="margin: 0; color: var(--text-secondary); font-size: 14px;">Total Siswa</p>
                </div>
                <div class="glass-effect rounded-lg p-6" style="text-align: center;">
                    <div style="font-size: 32px; font-weight: 700; color: #38BDF8; margin-bottom: 8px;">37</div>
                    <p style="margin: 0; color: var(--text-secondary); font-size: 14px;">Putra (Ikhwan)</p>
                </div>
                <div class="glass-effect rounded-lg p-6" style="text-align: center;">
                    <div style="font-size: 32px; font-weight: 700; color: #F472B6; margin-bottom: 8px;">42</div>
                    <p style="margin: 0; color: var(--text-secondary); font-size: 14px;">Putri (Akhwat)</p>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="glass-effect rounded-lg p-6" style="border: 1px solid #3c4a42;">
                <h3 style="margin-top: 0; margin-bottom: 20px; font-size: 18px; font-weight: 600;">Aksi Cepat</h3>
                <div style="display: flex; flex-direction: column; gap: 12px;">
                    <button id="changePwdBtn" class="btn-primary" style="width: 100%; justify-content: flex-start; padding: 12px;">
                        <span class="material-symbols-outlined">lock</span>
                        Ubah Password Admin
                    </button>
                </div>
            </div>

            <!-- Change Password Modal -->
            <div id="passwordModal" class="modal">
                <div class="modal-content">
                    <h2 style="margin-top: 0; margin-bottom: 20px; font-size: 20px; font-weight: 700;">Ubah Password</h2>
                    <form id="passwordForm" style="display: flex; flex-direction: column; gap: 16px;">
                        <div>
                            <label style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text-secondary);">Password Lama</label>
                            <input type="password" class="input-field" id="oldPassword" placeholder="Masukkan password lama" required>
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text-secondary);">Password Baru</label>
                            <input type="password" class="input-field" id="newPassword" placeholder="Min. 8 karakter" required>
                        </div>
                        <div>
                            <label style="display: block; margin-bottom: 6px; font-weight: 500; color: var(--text-secondary);">Konfirmasi Password</label>
                            <input type="password" class="input-field" id="confirmPassword" placeholder="Konfirmasi password baru" required>
                        </div>
                        <div style="display: flex; gap: 12px;">
                            <button type="submit" class="btn-primary" style="flex: 1;">Simpan</button>
                            <button type="button" class="btn-secondary" onclick="closePasswordModal()" style="flex: 1;">Batal</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Notifications -->
    <div id="notificationsContainer" style="position: fixed; top: 20px; right: 20px; z-index: 2000;"></div>

    <!-- Scripts -->
    <script src="admin.js"></script>
</body>
</html>
