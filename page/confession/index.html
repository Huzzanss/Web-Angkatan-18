<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confession — Angkatan 18</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../../index.html" class="nav-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                Angkatan 18
            </a>
            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../students/">Siswa</a></li>
                <li><a href="../confession/" class="active">Confession</a></li>
                <li><a href="../gallery/">Galeri</a></li>
                <li><a href="../announcements/">Pengumuman</a></li>
            </ul>
        </div>
    </nav>

    <section class="page-header">
        <div class="page-header-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </div>
        <h1>Confession</h1>
        <p>Ungkapkan perasaanmu secara anonim</p>
    </section>

    <div class="confession-notice">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Semua confession bersifat anonim. Jaga sopan santun dan hormati sesama.
    </div>

    <div class="msg-form-wrap">
        <div class="msg-form-card">
            <h3>Tulis Confession</h3>
            <form id="confForm">
                <div class="form-group">
                    <label>Confession <span style="color:var(--text3);font-weight:400;text-transform:none">(anonim)</span></label>
                    <textarea id="confContent" placeholder="Ungkapkan perasaanmu..." rows="4" maxlength="500" required></textarea>
                    <div class="char-count"><span id="confCount">0</span>/500</div>
                </div>
                <div class="form-group">
                    <label>Untuk siapa? <span style="color:var(--text3);font-weight:400;text-transform:none">(opsional)</span></label>
                    <input type="text" id="confTo" placeholder="Nama, inisial, atau dikosongkan..." maxlength="50">
                </div>
                <div class="form-group">
                    <label>Mood</label>
                    <div class="mood-picker">
                        <button type="button" class="mood-btn active" data-mood="happy" title="Senang">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 13s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                        </button>
                        <button type="button" class="mood-btn" data-mood="sad" title="Sedih">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                        </button>
                        <button type="button" class="mood-btn" data-mood="love" title="Cinta">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                        </button>
                        <button type="button" class="mood-btn" data-mood="nervous" title="Nervous">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 15h8"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                        </button>
                        <button type="button" class="mood-btn" data-mood="grateful" title="Bersyukur">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        </button>
                        <button type="button" class="mood-btn" data-mood="excited" title="Excited">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn btn-full">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Kirim Anonim
                </button>
            </form>
        </div>
    </div>

    <div class="msg-filter-wrap">
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">Semua</button>
            <button class="filter-tab" data-filter="has-to">Ada Tujuan</button>
            <button class="filter-tab" data-filter="no-to">Curhat Bebas</button>
        </div>
    </div>

    <div id="confList" class="msg-list">
        <div class="loading-state"><div class="spinner"></div><p>Memuat confession...</p></div>
    </div>

    <footer class="footer">
        <p>© 2026 Angkatan 18 — SMP Islam Bunga Bangsa Samarinda</p>
    </footer>

    <script type="module">
        import { db, ref, push, onValue } from "../../firebase.js";

        const MOOD_ICON = {
            happy:    `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 13s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`,
            sad:      `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`,
            love:     `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
            nervous:  `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 15h8"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`,
            grateful: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
            excited:  `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
        };

        let selectedMood = 'happy', currentFilter = 'all', allConf = [];

        document.querySelectorAll('.mood-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedMood = btn.dataset.mood;
            });
        });

        document.getElementById('confContent').addEventListener('input', e => {
            document.getElementById('confCount').textContent = e.target.value.length;
        });

        document.querySelectorAll('.filter-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderConf();
            });
        });

        document.getElementById('confForm').addEventListener('submit', async e => {
            e.preventDefault();
            const content = document.getElementById('confContent').value.trim();
            const to      = document.getElementById('confTo').value.trim();
            if (!content) return;
            const btn = e.target.querySelector('[type="submit"]');
            btn.disabled = true;
            try {
                await push(ref(db, 'confessions'), {
                    content, to: to || '', mood: selectedMood,
                    timestamp: Date.now(),
                    date: new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' })
                });
                e.target.reset();
                document.getElementById('confCount').textContent = '0';
                document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
                document.querySelector('.mood-btn[data-mood="happy"]').classList.add('active');
                selectedMood = 'happy';
            } catch (err) { alert('Gagal: ' + err.message); }
            finally { btn.disabled = false; }
        });

        onValue(ref(db, 'confessions'), snap => {
            allConf = [];
            snap.forEach(c => allConf.unshift({ key: c.key, ...c.val() }));
            renderConf();
        });

        function renderConf() {
            const list = document.getElementById('confList');
            let filtered = allConf;
            if (currentFilter === 'has-to') filtered = allConf.filter(c => c.to);
            if (currentFilter === 'no-to')  filtered = allConf.filter(c => !c.to);
            if (!filtered.length) {
                list.innerHTML = `<div class="empty-state">Belum ada confession.</div>`;
                return;
            }
            list.innerHTML = filtered.map((c, i) => `
                <div class="conf-card">
                    <div class="conf-top">
                        <span class="conf-number">Anonim #${allConf.length - allConf.indexOf(c)}</span>
                        <span class="conf-mood-icon">${MOOD_ICON[c.mood] || MOOD_ICON.happy}</span>
                    </div>
                    ${c.to ? `<p class="conf-to">Untuk: <strong>${c.to}</strong></p>` : ''}
                    <p class="msg-content">${c.content}</p>
                    <p class="msg-date">${c.date}</p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
