    <main class="container">
        <div class="page-header">
            <h1>Data Siswa Angkatan 18</h1>
            <p>Lihat profil semua teman-teman seangkatan</p>
        </div>

        <div class="students-controls">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">Semua (79)</button>
                <button class="filter-btn" data-filter="male">Putra (37)</button>
                <button class="filter-btn" data-filter="female">Putri (42)</button>
            </div>
            <input 
                type="text" 
                id="searchInput" 
                class="search-input" 
                placeholder="Cari nama siswa..." 
                autocomplete="off"
            >
        </div>

        <div id="studentsGrid" class="students-grid">
            <div class="loading">Memuat data siswa...</div>
        </div>
    </main>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content profile-modal">
            <button class="modal-close" id="closeProfileModal">&times;</button>
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar"></div>
                <div class="profile-info">
                    <h2 id="profileName"></h2>
                    <p id="profileClass"></p>
                    <p id="profileGender"></p>
                </div>
            </div>
            <div class="profile-badges" id="profileBadges"></div>
        </div>
    </div>

    <script src="../../firebase.js"></script>
    <script src="../../app.js"></script>
    <script>
        initTheme();

        const db = firebase.database();
        const studentsGrid = document.getElementById('studentsGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const profileModal = document.getElementById('profileModal');
        const closeProfileModal = document.getElementById('closeProfileModal');

        let currentFilter = 'all';
        let allStudents = STUDENTS;
        let allBadges = [];

        // Load badges
        function loadBadges() {
            db.ref('badges').on('value', (snapshot) => {
                allBadges = [];
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        allBadges.push(child.val());
                    });
                }
                renderStudents();
            });
        }

        function renderStudents(filtered = null) {
            const toRender = filtered || getFilteredStudents();
            
            if (toRender.length === 0) {
                studentsGrid.innerHTML = '<div class="empty-state">Tidak ada siswa ditemukan</div>';
                return;
            }

            studentsGrid.innerHTML = toRender.map(student => {
                const badges = allBadges.filter(b => b.studentName === student.name);
                const badgesHtml = badges.length > 0 
                    ? `<div class="student-badges">${badges.map(b => getBadgeIcon(b.type)).join('')}</div>`
                    : '';

                return `
                    <div class="student-card" onclick="openProfile('${student.name.replace(/'/g, "\\'")}', '${student.class.replace(/'/g, "\\'")}', '${student.gender.replace(/'/g, "\\'")}')" style="cursor: pointer;">
                        <div class="student-avatar">${getInitials(student.name)}</div>
                        <h3>${student.name}</h3>
                        <p>${student.class}</p>
                        ${badgesHtml}
                    </div>
                `;
            }).join('');
        }

        function getFilteredStudents() {
            let filtered = allStudents;
            
            if (currentFilter === 'male') {
                filtered = filtered.filter(s => s.gender === 'Laki-laki');
            } else if (currentFilter === 'female') {
                filtered = filtered.filter(s => s.gender === 'Perempuan');
            }

            const searchTerm = searchInput.value.toLowerCase();
            if (searchTerm) {
                filtered = filtered.filter(s => 
                    s.name.toLowerCase().includes(searchTerm)
                );
            }

            return filtered;
        }

        function getBadgeIcon(type) {
            const badges = {
                'best-student': '[Best]',
                'helpful': '[Help]',
                'funny': '[Funny]',
                'smart': '[Smart]',
                'creative': '[Creative]',
                'leader': '[Leader]'
            };
            return badges[type] || '[Badge]';
        }

        function openProfile(name, className, gender) {
            document.getElementById('profileName').textContent = name;
            document.getElementById('profileClass').textContent = className;
            document.getElementById('profileGender').textContent = gender === 'Laki-laki' ? 'Laki-laki' : 'Perempuan';
            document.getElementById('profileAvatar').textContent = getInitials(name);

            const studentBadges = allBadges.filter(b => b.studentName === name);
            const badgesHtml = studentBadges.length > 0
                ? `<div class="profile-badges-grid">${studentBadges.map(b => `
                    <div class="badge-item">
                        <div class="badge-icon-wrap">${getBadgeIcon(b.type)}</div>
                        <small>${getBadgeLabel(b.type)}</small>
                    </div>
                `).join('')}</div>`
                : '<p style="text-align: center; color: var(--text-secondary); font-size: 0.9rem;">Belum ada badge</p>';

            document.getElementById('profileBadges').innerHTML = badgesHtml;
            profileModal.style.display = 'flex';
        }

        function getBadgeLabel(type) {
            const labels = {
                'best-student': 'Siswa Terbaik',
                'helpful': 'Membantu',
                'funny': 'Lucu',
                'smart': 'Pintar',
                'creative': 'Kreatif',
                'leader': 'Pemimpin'
            };
            return labels[type] || 'Badge';
        }

        closeProfileModal.addEventListener('click', () => {
            profileModal.style.display = 'none';
        });

        profileModal.addEventListener('click', (e) => {
            if (e.target === profileModal) {
                profileModal.style.display = 'none';
            }
        });

        // Filter buttons
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderStudents();
            });
        });
