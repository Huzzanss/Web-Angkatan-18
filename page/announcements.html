<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumuman — Angkatan 18</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                Angkatan 18
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="students.html">Siswa</a></li>
                <li><a href="gallery.html">Galeri</a></li>
                <li><a href="announcements.html" class="active">Pengumuman</a></li>
            </ul>
        </div>
    </nav>

    <section class="page-header">
        <div class="page-header-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <h1>Pengumuman</h1>
        <p>Update dan informasi penting untuk Angkatan 18</p>
    </section>

    <div id="announceWrap" class="announcements-list">
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Memuat pengumuman...</p>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 Angkatan 18 — SMP Islam Bunga Bangsa Samarinda</p>
    </footer>

    <script type="module">
        import { db, ref, onValue } from "../firebase.js";

        const wrap = document.getElementById('announceWrap');

        onValue(ref(db, 'announcements'), snap => {
            const items = [];
            snap.forEach(child => items.unshift({ key: child.key, ...child.val() }));

            if (items.length === 0) {
                wrap.innerHTML = `<div class="empty-state">Belum ada pengumuman saat ini.</div>`;
                return;
            }

            wrap.innerHTML = items.map(item => `
                <div class="announcement-card priority-${item.priority}">
                    <h3>${item.title}</h3>
                    <p>${item.body}</p>
                    <div class="announcement-date">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        ${item.date}
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
