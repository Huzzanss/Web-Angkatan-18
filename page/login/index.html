<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Angkatan 18</title>
    <link rel="stylesheet" href="../../style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
        }
        .login-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 24px;
            text-align: center;
        }
        .login-logo {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .login-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .login-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .form-group label {
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(78, 222, 163, 0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
            transition: all 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(78, 222, 163, 0.08);
        }
        .login-submit {
            padding: 10px 16px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: var(--bg);
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 14px;
        }
        .login-submit:hover:not(:disabled) {
            opacity: 0.9;
        }
        .login-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .login-error {
            padding: 12px;
            background: rgba(232, 121, 160, 0.1);
            border: 1px solid rgba(232, 121, 160, 0.3);
            border-radius: 6px;
            color: #e879a0;
            font-size: 13px;
            display: none;
            margin-bottom: 16px;
        }
        .login-back {
            margin-top: 20px;
        }
        .login-back a {
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .login-back a:hover {
            color: var(--accent);
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(78, 222, 163, 0.1);
            border: 1px solid rgba(78, 222, 163, 0.2);
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            color: var(--accent);
            line-height: 0;
        }
        .theme-toggle:hover {
            background: rgba(78, 222, 163, 0.15);
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" title="Ganti tema">
        <svg id="moonIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="sunIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>

    <div class="login-container">
        <div class="login-box">
            <div class="login-logo">🔐</div>
            <div class="login-title">Admin Panel</div>
            <div class="login-subtitle">Angkatan 18</div>

            <div class="login-error" id="errorMessage"></div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                </div>

                <button type="submit" class="login-submit" id="submitBtn">Masuk</button>
            </form>

            <div class="login-back">
                <a href="../../">Kembali ke Home</a>
            </div>
        </div>
    </div>

    <script src="../../sound.js"></script>
    <script>
        const API_BASE = '/api';

        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const moonIcon = document.getElementById('moonIcon');
        const sunIcon = document.getElementById('sunIcon');
        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');

        function initTheme() {
            const savedTheme = localStorage.getItem('a18_theme') || 'dark';
            html.dataset.theme = savedTheme;
            updateThemeIcons(savedTheme);
        }

        function updateThemeIcons(theme) {
            moonIcon.style.display = theme === 'dark' ? '' : 'none';
            sunIcon.style.display = theme === 'light' ? '' : 'none';
        }

        themeToggle.addEventListener('click', () => {
            const newTheme = html.dataset.theme === 'dark' ? 'light' : 'dark';
            html.dataset.theme = newTheme;
            localStorage.setItem('a18_theme', newTheme);
            updateThemeIcons(newTheme);
        });

        initTheme();

        loginForm.addEventListener('submit', async e => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username || !password) {
                showError('Username dan password harus diisi');
                return;
            }

            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = 'Memproses...';
            errorMessage.style.display = 'none';

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.message || 'Login gagal');
                }

                if (data.token) {
                    sessionStorage.setItem('a18_admin_token', data.token);
                    window.location.href = '../admin/';
                } else {
                    throw new Error('Token tidak diterima');
                }
            } catch (err) {
                showError(err.message || 'Terjadi kesalahan');
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = '';
        }

        document.getElementById('username').focus();
    </script>
</body>
</html>
