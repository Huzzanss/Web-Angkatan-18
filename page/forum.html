<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum — Angkatan 18</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                Angkatan 18
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="students.html">Siswa</a></li>
                <li><a href="forum.html" class="active">Forum</a></li>
                <li><a href="gallery.html">Galeri</a></li>
                <li><a href="announcements.html">Pengumuman</a></li>
            </ul>
        </div>
    </nav>

    <!-- THREAD VIEW (hidden by default) -->
    <div id="threadView" style="display:none">
        <div class="thread-header">
            <button id="backBtn" class="btn-outline">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                Kembali
            </button>
            <div id="threadTitle" class="thread-title-wrap"></div>
        </div>

        <div id="threadReplies" class="thread-replies">
            <div class="loading-state"><div class="spinner"></div><p>Memuat...</p></div>
        </div>

        <div class="reply-form-wrap">
            <form id="replyForm">
                <div class="form-group">
                    <label>Namamu</label>
                    <input type="text" id="replyName" placeholder="Nama kamu..." maxlength="50" required>
                </div>
                <div class="form-group">
                    <label>Balasan</label>
                    <textarea id="replyContent" placeholder="Tulis balasanmu..." rows="3" maxlength="500" required></textarea>
                </div>
                <button type="submit" class="btn">Kirim Balasan</button>
            </form>
        </div>
    </div>

    <!-- FORUM LIST VIEW -->
    <div id="forumView">
        <section class="page-header">
            <div class="page-header-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <h1>Forum Diskusi</h1>
            <p>Diskusi bebas seputar Angkatan 18</p>
        </section>

        <!-- BUAT THREAD BARU -->
        <div class="msg-form-wrap">
            <div class="msg-form-card">
                <h3>Buat Thread Baru</h3>
                <form id="threadForm">
                    <div class="form-group">
                        <label>Namamu</label>
                        <input type="text" id="threadAuthor" placeholder="Nama kamu..." maxlength="50" required>
                    </div>
                    <div class="form-group">
                        <label>Judul Thread</label>
                        <input type="text" id="threadTitle2" placeholder="Topik diskusi..." maxlength="100" required>
                    </div>
                    <div class="form-group">
                        <label>Isi</label>
                        <textarea id="threadContent" placeholder="Ceritakan lebih lanjut..." rows="3" maxlength="500" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Kategori</label>
                        <div class="category-tabs">
                            <button type="button" class="cat-tab active" data-cat="umum">💬 Umum</button>
                            <button type="button" class="cat-tab" data-cat="tanya">❓ Tanya</button>
                            <button type="button" class="cat-tab" data-cat="seru">🎉 Seru</button>
                            <button type="button" class="cat-tab" data-cat="nostalgia">📸 Nostalgia</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-full">Buat Thread</button>
                </form>
            </div>
        </div>

        <!-- FILTER -->
        <div class="msg-filter-wrap">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">Semua</button>
                <button class="filter-tab" data-filter="umum">Umum</button>
                <button class="filter-tab" data-filter="tanya">Tanya</button>
                <button class="filter-tab" data-filter="seru">Seru</button>
                <button class="filter-tab" data-filter="nostalgia">Nostalgia</button>
            </div>
        </div>

        <!-- THREAD LIST -->
        <div id="threadList" class="msg-list">
            <div class="loading-state"><div class="spinner"></div><p>Memuat forum...</p></div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 Angkatan 18 — SMP Islam Bunga Bangsa Samarinda</p>
    </footer>

    <script type="module">
        import { db, ref, push, onValue, get } from "../firebase.js";

        const CAT_EMOJI = { umum:'💬', tanya:'❓', seru:'🎉', nostalgia:'📸' };
        let selectedCat  = 'umum';
        let currentFilter = 'all';
        let allThreads   = [];
        let currentThread = null;

        // ── CATEGORY TABS ──
        document.querySelectorAll('.cat-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedCat = btn.dataset.cat;
            });
        });

        // ── FILTER TABS ──
        document.querySelectorAll('.filter-tab').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderThreads();
            });
        });

        // ── BUAT THREAD ──
        document.getElementById('threadForm').addEventListener('submit', async e => {
            e.preventDefault();
            const author  = document.getElementById('threadAuthor').value.trim();
            const title   = document.getElementById('threadTitle2').value.trim();
            const content = document.getElementById('threadContent').value.trim();
            if (!author || !title || !content) return;

            const btn = e.target.querySelector('[type="submit"]');
            btn.textContent = 'Membuat...';
            btn.disabled = true;

            try {
                await push(ref(db, 'forum'), {
                    author, title, content,
                    category: selectedCat,
                    timestamp: Date.now(),
                    date: new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' }),
                    replyCount: 0
                });
                e.target.reset();
                document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
                document.querySelector('.cat-tab[data-cat="umum"]').classList.add('active');
                selectedCat = 'umum';
            } catch (err) {
                alert('Gagal: ' + err.message);
            } finally {
                btn.textContent = 'Buat Thread';
                btn.disabled = false;
            }
        });

        // ── LOAD THREADS ──
        onValue(ref(db, 'forum'), snap => {
            allThreads = [];
            snap.forEach(child => allThreads.unshift({ key: child.key, ...child.val() }));
            renderThreads();
        });

        function renderThreads() {
            const list = document.getElementById('threadList');
            let filtered = allThreads;
            if (currentFilter !== 'all') filtered = allThreads.filter(t => t.category === currentFilter);

            if (filtered.length === 0) {
                list.innerHTML = `<div class="empty-state">Belum ada thread. Mulai diskusi pertama! 💬</div>`;
                return;
            }

            list.innerHTML = filtered.map(t => `
                <div class="thread-card" data-key="${t.key}">
                    <div class="thread-cat">${CAT_EMOJI[t.category] || '💬'} ${t.category}</div>
                    <h3 class="thread-card-title">${t.title}</h3>
                    <p class="thread-preview">${t.content.substring(0, 120)}${t.content.length > 120 ? '...' : ''}</p>
                    <div class="thread-meta">
                        <span>
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            ${t.author}
                        </span>
                        <span>
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            ${t.replyCount || 0} balasan
                        </span>
                        <span>${t.date}</span>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.thread-card').forEach(card => {
                card.addEventListener('click', () => openThread(card.dataset.key));
            });
        }

        // ── OPEN THREAD ──
        function openThread(key) {
            currentThread = allThreads.find(t => t.key === key);
            if (!currentThread) return;

            document.getElementById('forumView').style.display = 'none';
            document.getElementById('threadView').style.display = '';

            document.getElementById('threadTitle').innerHTML = `
                <div class="thread-cat">${CAT_EMOJI[currentThread.category] || '💬'} ${currentThread.category}</div>
                <h2>${currentThread.title}</h2>
                <div class="thread-op">
                    <div class="msg-avatar">${currentThread.author.charAt(0).toUpperCase()}</div>
                    <div>
                        <strong>${currentThread.author}</strong>
                        <p class="msg-date">${currentThread.date}</p>
                    </div>
                </div>
                <p class="msg-content" style="margin-top:12px">${currentThread.content}</p>
                <div class="thread-divider">Balasan</div>
            `;

            onValue(ref(db, `forum_replies/${key}`), snap => {
                const replies = [];
                snap.forEach(child => replies.push({ key: child.key, ...child.val() }));
                renderReplies(replies);
            });
        }

        function renderReplies(replies) {
            const wrap = document.getElementById('threadReplies');
            if (replies.length === 0) {
                wrap.innerHTML = `<div class="empty-state" style="padding:24px">Belum ada balasan. Jadilah yang pertama!</div>`;
                return;
            }
            wrap.innerHTML = replies.map(r => `
                <div class="reply-card">
                    <div class="msg-avatar small">${r.name.charAt(0).toUpperCase()}</div>
                    <div class="reply-body">
                        <strong>${r.name}</strong>
                        <p>${r.content}</p>
                        <span class="msg-date">${r.date}</span>
                    </div>
                </div>
            `).join('');
        }

        // ── REPLY ──
        document.getElementById('replyForm').addEventListener('submit', async e => {
            e.preventDefault();
            if (!currentThread) return;
            const name    = document.getElementById('replyName').value.trim();
            const content = document.getElementById('replyContent').value.trim();
            if (!name || !content) return;

            const btn = e.target.querySelector('[type="submit"]');
            btn.textContent = 'Mengirim...';
            btn.disabled = true;

            try {
                await push(ref(db, `forum_replies/${currentThread.key}`), {
                    name, content,
                    timestamp: Date.now(),
                    date: new Date().toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' })
                });
                e.target.reset();
            } catch (err) {
                alert('Gagal: ' + err.message);
            } finally {
                btn.textContent = 'Kirim Balasan';
                btn.disabled = false;
            }
        });

        // ── BACK ──
        document.getElementById('backBtn').addEventListener('click', () => {
            document.getElementById('threadView').style.display = 'none';
            document.getElementById('forumView').style.display = '';
            currentThread = null;
        });
    </script>
</body>
</html>
