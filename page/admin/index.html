<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — Angkatan 18</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
    <style>
        .admin-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .admin-title { font-size: 28px; font-weight: 700; }
        .logout-btn { padding: 8px 16px; background: #e85555; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .logout-btn:hover { opacity: 0.9; }
        .tabs-container { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
        .tab-button { padding: 12px 16px; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 14px; font-weight: 500; border-bottom: 2px solid transparent; transition: all 0.2s; }
        .tab-button.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-button:hover { color: var(--text); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .form-section { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .form-section h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 13px; font-family: 'Inter', sans-serif; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
        .form-actions { display: flex; gap: 8px; }
        .btn-add { padding: 8px 14px; background: var(--accent); color: var(--bg); border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-add:hover { opacity: 0.9; }
        .btn-delete { padding: 6px 12px; background: #e85555; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
        .items-list { display: flex; flex-direction: column; gap: 12px; }
        .item-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .item-info { flex: 1; }
        .item-title { font-size: 14px; font-weight: 600; color: var(--text); }
        .item-desc { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 500px; width: 90%; }
        .modal-header { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
        .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
        .btn-confirm { padding: 8px 16px; background: var(--accent); color: var(--bg); border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-cancel { padding: 8px 16px; background: var(--border); color: var(--text); border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-confirm:hover { opacity: 0.9; }
        .btn-cancel:hover { opacity: 0.8; }
        .badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .badge-item { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; position: relative; }
        .badge-name { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .badge-count { font-size: 12px; color: var(--text-secondary); }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../../index.html" class="nav-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                Angkatan 18 Admin
            </a>
            <button class="logout-btn" id="logoutBtn">Keluar</button>
        </div>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h1 class="admin-title">Admin Panel</h1>
        </div>

        <div class="tabs-container">
            <button class="tab-button active" data-tab="galeri">Galeri</button>
            <button class="tab-button" data-tab="fotoreq">Foto Request</button>
            <button class="tab-button" data-tab="pengumuman">Pengumuman</button>
            <button class="tab-button" data-tab="polling">Polling</button>
            <button class="tab-button" data-tab="badges">Badges</button>
        </div>

        <!-- GALERI TAB -->
        <div id="galeri" class="tab-content active">
            <div class="form-section">
                <h3>Tambah Foto</h3>
                <div class="form-group">
                    <label>URL Foto</label>
                    <input type="text" id="galleryUrl" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Judul</label>
                    <input type="text" id="galleryTitle" placeholder="Judul foto">
                </div>
                <div class="form-actions">
                    <button class="btn-add" id="addGalleryBtn">Tambah Foto</button>
                </div>
            </div>
            <div class="items-list" id="galleryList"></div>
        </div>

        <!-- FOTO REQUEST TAB -->
        <div id="fotoreq" class="tab-content">
            <div class="items-list" id="photoReqList"></div>
        </div>

        <!-- PENGUMUMAN TAB -->
        <div id="pengumuman" class="tab-content">
            <div class="form-section">
                <h3>Buat Pengumuman</h3>
                <div class="form-group">
                    <label>Judul</label>
                    <input type="text" id="announcementTitle" placeholder="Judul pengumuman">
                </div>
                <div class="form-group">
                    <label>Isi</label>
                    <textarea id="announcementBody" placeholder="Isi pengumuman" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label>Prioritas</label>
                    <select id="announcementPriority">
                        <option value="normal">Normal</option>
                        <option value="high">Tinggi</option>
                        <option value="urgent">Urgen</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn-add" id="addAnnouncementBtn">Buat Pengumuman</button>
                </div>
            </div>
            <div class="items-list" id="announcementList"></div>
        </div>

        <!-- POLLING TAB -->
        <div id="polling" class="tab-content">
            <div class="form-section">
                <h3>Buat Poll</h3>
                <div class="form-group">
                    <label>Pertanyaan</label>
                    <input type="text" id="pollQuestion" placeholder="Apa pertanyaanmu?">
                </div>
                <div id="pollOptions"></div>
                <div class="form-actions">
                    <button class="btn-add" id="addOptionBtn" style="margin-bottom: 16px;">Tambah Opsi</button>
                    <button class="btn-add" id="addPollBtn">Buat Poll</button>
                </div>
            </div>
            <div class="items-list" id="pollList"></div>
        </div>

        <!-- BADGES TAB -->
        <div id="badges" class="tab-content">
            <div class="form-section">
                <h3>Berikan Badge</h3>
                <div class="form-group">
                    <label>Nama Siswa</label>
                    <input type="text" id="badgeStudent" placeholder="Nama siswa">
                </div>
                <div class="form-group">
                    <label>Tipe Badge</label>
                    <select id="badgeType">
                        <option value="best-student">Best Student</option>
                        <option value="helpful">Helpful</option>
                        <option value="funny">Funny</option>
                        <option value="smart">Smart</option>
                        <option value="creative">Creative</option>
                        <option value="leader">Leader</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn-add" id="addBadgeBtn">Berikan Badge</button>
                </div>
            </div>
            <div id="badgesGrid" class="badge-grid"></div>
        </div>
    </div>

    <div id="photoPreviewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Pratinjau Foto</div>
            <img id="previewImage" src="" style="width: 100%; border-radius: 6px; margin-bottom: 16px;">
            <div id="previewInfo"></div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closePhotoPreviewModal()">Tutup</button>
                <button class="btn-confirm" id="approvePhotoBtn">Setujui</button>
                <button class="btn-delete" id="rejectPhotoBtn">Tolak</button>
            </div>
        </div>
    </div>

    <script src="../../firebase.js"></script>
    <script>
        if (sessionStorage.getItem('admin_logged_in') !== 'true') {
            window.location.href = '../login/';
        }

        const db = firebase.database();
        let currentPhotoId = null;
        let pollOptionCount = 0;

        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem('admin_logged_in');
            sessionStorage.removeItem('admin_username');
            window.location.href = '../login/';
        });

        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                const tabId = btn.dataset.tab;
                document.getElementById(tabId).classList.add('active');
                
                if (tabId === 'fotoreq') loadPhotoRequests();
                if (tabId === 'badges') loadBadges();
            });
        });

        document.getElementById('addGalleryBtn').addEventListener('click', () => {
            const url = document.getElementById('galleryUrl').value;
            const title = document.getElementById('galleryTitle').value;
            if (url && title) {
                db.ref('gallery').push({
                    src: url,
                    title: title,
                    timestamp: Date.now()
                });
                document.getElementById('galleryUrl').value = '';
                document.getElementById('galleryTitle').value = '';
                loadGallery();
            }
        });

        function loadGallery() {
            db.ref('gallery').on('value', snap => {
                const list = document.getElementById('galleryList');
                list.innerHTML = '';
                snap.forEach(child => {
                    const item = child.val();
                    const el = document.createElement('div');
                    el.className = 'item-card';
                    el.innerHTML = `
                        <div class="item-info">
                            <div class="item-title">${item.title}</div>
                            <div class="item-desc">${item.src.substring(0, 50)}...</div>
                        </div>
                        <button class="btn-delete" onclick="deleteGallery('${child.key}')">Hapus</button>
                    `;
                    list.appendChild(el);
                });
            });
        }

        function deleteGallery(key) {
            db.ref('gallery/' + key).remove();
        }

        function loadPhotoRequests() {
            db.ref('photoRequests').on('value', snap => {
                const list = document.getElementById('photoReqList');
                list.innerHTML = '';
                snap.forEach(child => {
                    const item = child.val();
                    if (item.status === 'pending') {
                        const el = document.createElement('div');
                        el.className = 'item-card';
                        el.innerHTML = `
                            <div class="item-info">
                                <div class="item-title">${item.title}</div>
                                <div class="item-desc">Dari: ${item.submitterName}</div>
                            </div>
                            <button class="btn-add" onclick="previewPhoto('${child.key}', '${item.src}', '${item.title}', '${item.submitterName}')">Lihat</button>
                        `;
                        list.appendChild(el);
                    }
                });
            });
        }

        function previewPhoto(id, src, title, name) {
            currentPhotoId = id;
            document.getElementById('previewImage').src = src;
            document.getElementById('previewInfo').innerHTML = `<strong>${title}</strong><br>Dari: ${name}`;
            document.getElementById('photoPreviewModal').classList.add('show');
        }

        function closePhotoPreviewModal() {
            document.getElementById('photoPreviewModal').classList.remove('show');
        }

        document.getElementById('approvePhotoBtn').addEventListener('click', () => {
            db.ref('photoRequests/' + currentPhotoId).update({ status: 'approved' });
            db.ref('photoRequests/' + currentPhotoId).once('value', snap => {
                const item = snap.val();
                db.ref('gallery').push({
                    src: item.src,
                    title: item.title,
                    timestamp: Date.now()
                });
            });
            closePhotoPreviewModal();
            loadPhotoRequests();
        });

        document.getElementById('rejectPhotoBtn').addEventListener('click', () => {
            db.ref('photoRequests/' + currentPhotoId).update({ status: 'rejected' });
            closePhotoPreviewModal();
            loadPhotoRequests();
        });

        document.getElementById('addAnnouncementBtn').addEventListener('click', () => {
            const title = document.getElementById('announcementTitle').value;
            const body = document.getElementById('announcementBody').value;
            const priority = document.getElementById('announcementPriority').value;
            if (title && body) {
                db.ref('announcements').push({
                    title: title,
                    body: body,
                    priority: priority,
                    timestamp: Date.now()
                });
                document.getElementById('announcementTitle').value = '';
                document.getElementById('announcementBody').value = '';
            }
        });

        db.ref('announcements').on('value', snap => {
            const list = document.getElementById('announcementList');
            list.innerHTML = '';
            snap.forEach(child => {
                const item = child.val();
                const el = document.createElement('div');
                el.className = 'item-card';
                el.innerHTML = `
                    <div class="item-info">
                        <div class="item-title">${item.title}</div>
                        <div class="item-desc">Prioritas: ${item.priority}</div>
                    </div>
                    <button class="btn-delete" onclick="deleteAnnouncement('${child.key}')">Hapus</button>
                `;
                list.appendChild(el);
            });
        });

        function deleteAnnouncement(key) {
            db.ref('announcements/' + key).remove();
        }

        document.getElementById('addOptionBtn').addEventListener('click', () => {
            pollOptionCount++;
            const container = document.getElementById('pollOptions');
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'form-group';
            input.placeholder = `Opsi ${pollOptionCount}`;
            input.style.marginBottom = '8px';
            input.dataset.option = pollOptionCount;
            container.appendChild(input);
        });

        document.getElementById('addPollBtn').addEventListener('click', () => {
            const question = document.getElementById('pollQuestion').value;
            const options = Array.from(document.querySelectorAll('#pollOptions input'))
                .map(el => el.value)
                .filter(v => v);
            if (question && options.length >= 2) {
                db.ref('polls').push({
                    question: question,
                    options: options,
                    timestamp: Date.now()
                });
                document.getElementById('pollQuestion').value = '';
                document.getElementById('pollOptions').innerHTML = '';
                pollOptionCount = 0;
            }
        });

        db.ref('polls').on('value', snap => {
            const list = document.getElementById('pollList');
            list.innerHTML = '';
            snap.forEach(child => {
                const item = child.val();
                const el = document.createElement('div');
                el.className = 'item-card';
                el.innerHTML = `
                    <div class="item-info">
                        <div class="item-title">${item.question}</div>
                        <div class="item-desc">${item.options.length} opsi</div>
                    </div>
                    <button class="btn-delete" onclick="deletePoll('${child.key}')">Hapus</button>
                `;
                list.appendChild(el);
            });
        });

        function deletePoll(key) {
            db.ref('polls/' + key).remove();
        }

        document.getElementById('addBadgeBtn').addEventListener('click', () => {
            const name = document.getElementById('badgeStudent').value;
            const type = document.getElementById('badgeType').value;
            if (name) {
                db.ref('badges').push({
                    studentName: name,
                    type: type,
                    timestamp: Date.now()
                });
                document.getElementById('badgeStudent').value = '';
            }
        });

        function loadBadges() {
            db.ref('badges').on('value', snap => {
                const types = {};
                snap.forEach(child => {
                    const item = child.val();
                    if (!types[item.type]) types[item.type] = 0;
                    types[item.type]++;
                });
                
                const grid = document.getElementById('badgesGrid');
                grid.innerHTML = '';
                Object.entries(types).forEach(([type, count]) => {
                    const el = document.createElement('div');
                    el.className = 'badge-item';
                    el.innerHTML = `
                        <div class="badge-name">${type}</div>
                        <div class="badge-count">${count} pemberian</div>
                    `;
                    grid.appendChild(el);
                });
            });
        }

        loadGallery();
    </script>
</body>
</html>
