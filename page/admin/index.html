<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Angkatan 18</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="../../index.html" class="nav-logo">Angkatan 18</a>
            <div style="display:flex;align-items:center;gap:20px">
                <ul class="nav-links">
                    <li><a href="../../index.html">Home</a></li>
                    <li><a href="../students/">Siswa</a></li>
                    <li><a href="../gallery/">Galeri</a></li>
                    <li><a href="../announcements/">Pengumuman</a></li>
                </ul>
                <button class="theme-toggle" id="themeToggle" title="Ganti tema">
                    <svg id="moonIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg id="sunIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="page-header">
        <div class="page-header-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </div>
        <h1>Admin Panel</h1>
        <p>Kelola konten Angkatan 18</p>
    </div>

    <div class="content-section">
        <div style="max-width:1000px;margin:0 auto">
            <div id="adminContent" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px">
                <!-- Admin Menu akan di-generate oleh script -->
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 Angkatan 18 — SMP Islam Bunga Bangsa Samarinda</p>
    </footer>

    <script src="../../sound.js"></script>
    <script>
        const getToken = () => sessionStorage.getItem('a18_admin_token');
        
        // Check auth
        if (!getToken()) {
            window.location.href = '../login/';
        }

        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const moonIcon = document.getElementById('moonIcon');
        const sunIcon = document.getElementById('sunIcon');
        const adminContent = document.getElementById('adminContent');

        function initTheme() {
            const savedTheme = localStorage.getItem('a18_theme') || 'dark';
            html.dataset.theme = savedTheme;
            updateThemeIcons(savedTheme);
        }

        function updateThemeIcons(theme) {
            moonIcon.style.display = theme === 'dark' ? '' : 'none';
            sunIcon.style.display = theme === 'light' ? '' : 'none';
        }

        themeToggle.addEventListener('click', () => {
            const newTheme = html.dataset.theme === 'dark' ? 'light' : 'dark';
            html.dataset.theme = newTheme;
            localStorage.setItem('a18_theme', newTheme);
            updateThemeIcons(newTheme);
        });

        const adminMenus = [
            { title: 'Pengumuman', desc: 'Kelola pengumuman', href: '../announcements/', icon: 'M4 4h16v10H4z' },
            { title: 'Galeri', desc: 'Upload foto angkatan', href: '../gallery/', icon: 'M21 15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z' },
            { title: 'Polling', desc: 'Buat survey & voting', href: '../polling/', icon: 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77' },
            { title: 'Leaderboard', desc: 'Kelola poin siswa', href: '../leaderboard/', icon: 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77' },
            { title: 'Siswa', desc: 'Daftar siswa angkatan', href: '../students/', icon: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2' },
            { title: 'Logout', desc: 'Keluar dari admin', href: '#logout', icon: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4' }
        ];

        adminContent.innerHTML = adminMenus.map(menu => `
            <div class="card" style="cursor:pointer;transition:all 0.2s" onclick="${menu.href === '#logout' ? 'logout()' : `window.location.href='${menu.href}'`}">
                <div style="display:flex;align-items:flex-start;gap:12px">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5">
                        <path d="${menu.icon}"/>
                    </svg>
                    <div>
                        <h3 style="margin:0 0 4px 0;font-size:16px">${menu.title}</h3>
                        <p style="margin:0;font-size:12px;color:var(--text-secondary)">${menu.desc}</p>
                    </div>
                </div>
            </div>
        `).join('');

        function logout() {
            if (confirm('Logout dari admin panel?')) {
                sessionStorage.removeItem('a18_admin_token');
                window.location.href = '../login/';
            }
        }

        initTheme();
    </script>
</body>
</html>
