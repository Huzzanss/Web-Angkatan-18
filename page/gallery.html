<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri — Angkatan 18</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                Angkatan 18
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="students.html">Siswa</a></li>
                <li><a href="gallery.html" class="active">Galeri</a></li>
                <li><a href="announcements.html">Pengumuman</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </div>
    </nav>

    <section class="page-header">
        <div class="page-header-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </div>
        <h1>Galeri</h1>
        <p>Koleksi foto dan momen spesial Angkatan 18</p>
    </section>

    <div id="galleryWrap" class="gallery-section"></div>

    <footer class="footer">
        <p>© 2026 Angkatan 18 — SMP Islam Bunga Bangsa Samarinda</p>
    </footer>

    <!-- LIGHTBOX -->
    <div id="lightbox" style="display:none">
        <div id="lightboxOverlay"></div>
        <div id="lightboxContent">
            <img id="lightboxImg" src="" alt="">
            <p id="lightboxTitle"></p>
            <button id="lightboxClose">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
    </div>

    <script>
        function getGallery() {
            return JSON.parse(localStorage.getItem('a18_gallery') || '[]');
        }

        function renderGallery() {
            const wrap  = document.getElementById('galleryWrap');
            const items = getGallery();

            if (items.length === 0) {
                wrap.innerHTML = `
                    <div class="gallery-empty">
                        <div class="gallery-placeholder">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3;margin:0 auto 16px;display:block"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            <p>Belum ada foto</p>
                            <p style="margin-top:6px;font-size:13px;opacity:0.5">Admin dapat menambahkan foto melalui <a href="admin.html" style="color:#4EDEA3">halaman admin</a></p>
                        </div>
                    </div>`;
                return;
            }

            wrap.innerHTML = `<div class="gallery-grid">${
                items.map((item, i) => `
                    <div class="gallery-item" data-index="${i}">
                        <img src="${item.src}" alt="${item.title}" loading="lazy">
                        <div class="gallery-item-overlay">
                            <p>${item.title}</p>
                        </div>
                    </div>
                `).join('')
            }</div>`;

            // Lightbox
            wrap.querySelectorAll('.gallery-item').forEach(el => {
                el.addEventListener('click', () => {
                    const i = +el.dataset.index;
                    document.getElementById('lightboxImg').src = items[i].src;
                    document.getElementById('lightboxTitle').textContent = items[i].title;
                    document.getElementById('lightbox').style.display = 'flex';
                });
            });
        }

        document.getElementById('lightboxClose').addEventListener('click', () => {
            document.getElementById('lightbox').style.display = 'none';
        });
        document.getElementById('lightboxOverlay').addEventListener('click', () => {
            document.getElementById('lightbox').style.display = 'none';
        });

        renderGallery();
    </script>
</body>
</html>
