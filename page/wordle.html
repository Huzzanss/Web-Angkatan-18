    <section class="page-header">
        <div class="page-header-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        </div>
        <h1>Wordle Nama</h1>
        <p>Tebak nama teman Angkatan 18 dalam 6 percobaan!</p>
    </section>

    <div class="wordle-wrap">
        <!-- HINT -->
        <div class="wordle-hint" id="wordleHint"></div>

        <!-- GRID -->
        <div id="wordleGrid" class="wordle-grid"></div>

        <!-- KEYBOARD -->
        <div class="wordle-keyboard" id="wordleKeyboard"></div>

        <!-- STATUS -->
        <div id="wordleStatus" class="wordle-status"></div>

        <!-- ACTION BUTTONS -->
        <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
            <button id="giveUpBtn" class="btn-outline">Menyerah</button>
            <button id="nextWordBtn" class="btn">Nama Lain →</button>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 Angkatan 18 — SMP Islam Bunga Bangsa Samarinda</p>
    </footer>

    <script>
        // Gunakan nama depan siswa sebagai kata
        const FIRST_NAMES = [
            "FAALIH","MUHAMMAD","HANDANU","ALMER","HAFIDZ","ZHARIF","CHAERUL","AHMAD","AZKA","ASYRAF",
            "FAEYZA","ABDULLAH","ELKALI","GHAZALI","FAQIH","ABDURRAHMAN","ALKHALIFI","LATHIEF","REGA",
            "GIOVANNY","HASAN","ASBILLAH","BAATS","FATTAH","NAMARA","FARREL","ALBUCHORI","SUPER",
            "NAUFAL","RAFAY","DEVAN","JEEVAN","RAYHAN","AFIQAH","SHAZIA","AISYAH","ADINDA","SHYBILYA",
            "ADELIA","ANGELINA","NABILA","ZARA","AQILAH","NADHIFA","SYAQUILA","KANAYA","ALISYA",
            "KIMBERLY","AFIKA","DEEANDRA","HANANIA","LATHIFAH","NURUL","ADZKIRA","ANNISA","PUTRI",
            "NADA","ASGHIA","ALESHA","ALISHA","ALENKA","KHALILAH","DZAKIRA","FELISHA","SHIDQIA",
            "ARINI","AINUN","FATIMAH","VANISHA","AMEERA","AMIRAH","SACHI","ZAHRATU"
        ].filter(n => n.length >= 4 && n.length <= 8);

        const KEYBOARD_ROWS = [
            ['Q','W','E','R','T','Y','U','I','O','P'],
            ['A','S','D','F','G','H','J','K','L'],
            ['ENTER','Z','X','C','V','B','N','M','⌫']
        ];

        let target    = '';
        let guesses   = [];
        let current   = '';
        let gameOver  = false;
        const MAX_TRIES = 6;

        function newGame() {
            target   = FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)];
            guesses  = [];
            current  = '';
            gameOver = false;
            document.getElementById('wordleStatus').textContent = '';
            document.getElementById('wordleHint').textContent = `Nama depan siswa — ${target.length} huruf`;
            buildGrid();
            buildKeyboard();
        }

        function buildGrid() {
            const grid = document.getElementById('wordleGrid');
            grid.style.gridTemplateColumns = `repeat(${target.length}, 1fr)`;
            grid.innerHTML = '';
            for (let r = 0; r < MAX_TRIES; r++) {
                for (let c = 0; c < target.length; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'wordle-cell';
                    cell.id = `cell-${r}-${c}`;
                    grid.appendChild(cell);
                }
            }
        }

        function buildKeyboard() {
            const kb = document.getElementById('wordleKeyboard');
            kb.innerHTML = '';
            KEYBOARD_ROWS.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'wordle-kb-row';
                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'wordle-key';
                    btn.textContent = key;
                    btn.dataset.key = key;
                    if (key === 'ENTER' || key === '⌫') btn.classList.add('wide');
                    btn.addEventListener('click', () => handleKey(key));
                    rowEl.appendChild(btn);
                });
                kb.appendChild(rowEl);
            });
        }

        function handleKey(key) {
            if (gameOver) return;
            if (key === '⌫') {
                current = current.slice(0, -1);
            } else if (key === 'ENTER') {
                if (current.length !== target.length) {
                    shake();
                    return;
                }
                submitGuess();
            } else if (current.length < target.length) {
                current += key;
            }
            updateCurrentRow();
        }

        function updateCurrentRow() {
            const row = guesses.length;
            for (let c = 0; c < target.length; c++) {
                const cell = document.getElementById(`cell-${row}-${c}`);
                cell.textContent = current[c] || '';
                cell.classList.toggle('wordle-cell-filled', !!current[c]);
            }
        }

        function submitGuess() {
            const guess = current;
            const result = evaluate(guess, target);
            const row = guesses.length;

            result.forEach((state, c) => {
                const cell = document.getElementById(`cell-${row}-${c}`);
                setTimeout(() => {
                    cell.classList.add('wordle-flip', `wordle-${state}`);
                    updateKeyColor(guess[c], state);
                }, c * 80);
            });

            guesses.push(guess);
            current = '';

            setTimeout(() => {
                if (guess === target) {
                    gameOver = true;
                    document.getElementById('wordleStatus').innerHTML = `<span style="color:#4EDEA3">🎉 Benar! Nama: ${target}</span>`;
                } else if (guesses.length >= MAX_TRIES) {
                    gameOver = true;
                    document.getElementById('wordleStatus').innerHTML = `<span style="color:#e85555">Jawabannya: <strong>${target}</strong></span>`;
                }
            }, target.length * 80 + 200);
        }

        function evaluate(guess, target) {
            const result   = Array(target.length).fill('absent');
            const tArr     = target.split('');
            const gArr     = guess.split('');
            const tUsed    = Array(target.length).fill(false);
            const gUsed    = Array(target.length).fill(false);

            // First pass: correct
            gArr.forEach((ch, i) => {
                if (ch === tArr[i]) {
                    result[i] = 'correct';
                    tUsed[i] = gUsed[i] = true;
                }
            });

            // Second pass: present
            gArr.forEach((ch, i) => {
                if (gUsed[i]) return;
                const ti = tArr.findIndex((tc, ti) => !tUsed[ti] && tc === ch);
                if (ti !== -1) {
                    result[i] = 'present';
                    tUsed[ti] = gUsed[i] = true;
                }
            });

            return result;
        }

        function updateKeyColor(letter, state) {
            const btn = document.querySelector(`.wordle-key[data-key="${letter}"]`);
            if (!btn) return;
            const priority = ['correct','present','absent'];
            const cur = btn.dataset.state || '';
            if (!cur || priority.indexOf(state) < priority.indexOf(cur)) {
                btn.dataset.state = state;
                btn.classList.remove('wordle-correct','wordle-present','wordle-absent');
                btn.classList.add(`wordle-${state}`);
            }
        }

        function shake() {
            const row = guesses.length;
            for (let c = 0; c < target.length; c++) {
                const cell = document.getElementById(`cell-${row}-${c}`);
                cell.classList.add('wordle-shake');
                setTimeout(() => cell.classList.remove('wordle-shake'), 400);
            }
        }

        document.getElementById('nextWordBtn').addEventListener('click', newGame);
        document.getElementById('giveUpBtn').addEventListener('click', () => {
            gameOver = true;
            document.getElementById('wordleStatus').innerHTML = `Jawabannya: <strong style="color:#4EDEA3">${target}</strong>`;
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') handleKey('ENTER');
            else if (e.key === 'Backspace') handleKey('⌫');
            else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
        });

        newGame();
    </script>
</body>
</html>
