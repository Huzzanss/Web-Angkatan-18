<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Angkatan 18</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="../">⚙️ Admin Panel</a>
        </div>
        <div class="nav-right">
            <button class="theme-toggle" id="themeToggle">🌙</button>
            <button id="logoutBtn" class="btn btn-danger">Logout</button>
        </div>
    </nav>

    <main class="container">
        <div class="page-header">
            <h1>⚙️ Admin Dashboard</h1>
            <p>Kelola konten Angkatan 18</p>
        </div>

        <!-- Admin Tabs -->
        <div class="admin-tabs">
            <button class="admin-tab-btn active" data-tab="galeri">📸 Galeri</button>
            <button class="admin-tab-btn" data-tab="fotoreq">📤 Foto Request</button>
            <button class="admin-tab-btn" data-tab="pengumuman">📢 Pengumuman</button>
            <button class="admin-tab-btn" data-tab="polling">🗳️ Polling</button>
            <button class="admin-tab-btn" data-tab="badges">🎖️ Badges</button>
        </div>

        <!-- TAB 1: GALERI -->
        <div id="galeriTab" class="admin-tab-content active">
            <div style="max-width: 1100px; margin: 0 auto; padding: 0 24px;">
                <h2>📸 Kelola Galeri</h2>
                <div class="admin-form-box">
                    <div class="form-group">
                        <label for="photoUrl">URL Foto:</label>
                        <input type="text" id="photoUrl" class="form-input" placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label for="photoTitle">Judul:</label>
                        <input type="text" id="photoTitle" class="form-input" placeholder="Judul foto">
                    </div>
                    <button id="addPhotoBtn" class="btn btn-primary">+ Tambah Foto</button>
                </div>
                <div id="photoList" class="admin-list"></div>
            </div>
        </div>

        <!-- TAB 2: FOTO REQUEST -->
        <div id="fotoreqTab" class="admin-tab-content">
            <div style="max-width: 1100px; margin: 0 auto; padding: 0 24px;">
                <h2>📤 Permintaan Foto</h2>
                <p style="color: var(--text3); margin-bottom: 1rem;">Foto yang menunggu persetujuan</p>
                <div id="photoRequestList" class="admin-list"></div>
            </div>
        </div>

        <!-- TAB 3: PENGUMUMAN -->
        <div id="pengumumanTab" class="admin-tab-content">
            <div style="max-width: 1100px; margin: 0 auto; padding: 0 24px;">
                <h2>📢 Buat Pengumuman</h2>
                <div class="admin-form-box">
                    <div class="form-group">
                        <label for="announcementTitle">Judul:</label>
                        <input type="text" id="announcementTitle" class="form-input" placeholder="Judul pengumuman">
                    </div>
                    <div class="form-group">
                        <label for="announcementBody">Isi:</label>
                        <textarea id="announcementBody" class="form-input" placeholder="Isi pengumuman" rows="4"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="announcementPriority">Prioritas:</label>
                        <select id="announcementPriority" class="form-input">
                            <option value="low">🟢 Rendah</option>
                            <option value="medium" selected>🟡 Sedang</option>
                            <option value="high">🔴 Tinggi</option>
                        </select>
                    </div>
                    <button id="addAnnouncementBtn" class="btn btn-primary">+ Buat Pengumuman</button>
                </div>
                <div id="announcementList" class="admin-list"></div>
            </div>
        </div>

        <!-- TAB 4: POLLING -->
        <div id="pollingTab" class="admin-tab-content">
            <div style="max-width: 1100px; margin: 0 auto; padding: 0 24px;">
                <h2>🗳️ Buat Polling</h2>
                <div class="admin-form-box">
                    <div class="form-group">
                        <label for="pollQuestion">Pertanyaan:</label>
                        <input type="text" id="pollQuestion" class="form-input" placeholder="Pertanyaan polling">
                    </div>
                    <div class="form-group">
                        <label>Pilihan:</label>
                        <div id="pollOptionsContainer">
                            <input type="text" class="poll-option form-input" placeholder="Pilihan 1">
                            <input type="text" class="poll-option form-input" placeholder="Pilihan 2">
                        </div>
                        <button id="addOptionBtn" class="btn btn-secondary" style="margin-top: 0.5rem;">+ Tambah Pilihan</button>
                    </div>
                    <button id="addPollBtn" class="btn btn-primary">+ Buat Polling</button>
                </div>
                <div id="pollList" class="admin-list"></div>
            </div>
        </div>

        <!-- TAB 5: BADGES -->
        <div id="badgesTab" class="admin-tab-content">
            <div style="max-width: 1100px; margin: 0 auto; padding: 0 24px;">
                <h2>🎖️ Kelola Badges</h2>
                <button id="openBadgeFormBtn" class="btn btn-primary">+ Berikan Badge</button>
                <div id="badgeList" class="admin-list"></div>
            </div>
        </div>
    </main>

    <!-- Modal: Badge Form -->
    <div id="badgeFormModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Berikan Badge</h2>
                <button class="modal-close" id="closeBadgeFormModal">&times;</button>
            </div>
            <form id="badgeForm" class="modal-body">
                <div class="form-group">
                    <label for="badgeStudentName">Nama Siswa:</label>
                    <input type="text" id="badgeStudentName" class="form-input" placeholder="Cari nama siswa" required>
                </div>
                <div class="form-group">
                    <label for="badgeType">Tipe Badge:</label>
                    <select id="badgeType" class="form-input" required>
                        <option value="">Pilih tipe badge...</option>
                        <option value="best-student">🏆 Siswa Terbaik</option>
                        <option value="helpful">🤝 Membantu</option>
                        <option value="funny">😂 Lucu</option>
                        <option value="smart">🧠 Pintar</option>
                        <option value="creative">🎨 Kreatif</option>
                        <option value="leader">👑 Pemimpin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Berikan Badge</button>
            </form>
        </div>
    </div>

    <!-- Modal: Foto Request Preview -->
    <div id="photoReqModal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <button class="modal-close" id="closePhotoReqModal">&times;</button>
            <div class="modal-body">
                <img id="photoReqImage" src="" alt="Foto" style="width: 100%; border-radius: 8px; margin-bottom: 1rem;">
                <h3 id="photoReqTitle"></h3>
                <p id="photoReqDesc"></p>
                <small id="photoReqSubmitter"></small>
                <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                    <button id="approvePhotoReqBtn" class="btn btn-primary" style="flex: 1;">✓ Setujui</button>
                    <button id="rejectPhotoReqBtn" class="btn btn-danger" style="flex: 1;">✗ Tolak</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../firebase.js"></script>
    <script src="../app.js"></script>
    <script>
        initTheme();

        // CHECK SESSION
        if (sessionStorage.getItem('admin_logged_in') !== 'true') {
            window.location.href = 'login.html';
        }

        const db = firebase.database();

        // LOGOUT
        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionStorage.removeItem('admin_logged_in');
            sessionStorage.removeItem('admin_username');
            window.location.href = 'login.html';
        });

        // TAB NAVIGATION
        const tabBtns = document.querySelectorAll('.admin-tab-btn');
        const tabContents = document.querySelectorAll('.admin-tab-content');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');
            });
        });

        // ========== GALERI ==========
        document.getElementById('addPhotoBtn').addEventListener('click', () => {
            const url = document.getElementById('photoUrl').value.trim();
            const title = document.getElementById('photoTitle').value.trim();
            if (!url || !title) return alert('Isi semua field');
            
            db.ref('gallery').push({src: url, title, timestamp: Date.now()}).then(() => {
                document.getElementById('photoUrl').value = '';
                document.getElementById('photoTitle').value = '';
                loadPhotos();
            });
        });

        function loadPhotos() {
            db.ref('gallery').on('value', s => {
                const items = [];
                s.forEach(c => items.push({key: c.key, ...c.val()}));
                document.getElementById('photoList').innerHTML = items.length === 0 
                    ? '<div class="empty-state">Belum ada foto</div>'
                    : items.map(p => `
                    <div class="admin-item">
                        <span>${p.title}</span>
                        <button class="btn btn-danger btn-sm" onclick="deletePhoto('${p.key}')">Hapus</button>
                    </div>`).join('');
            });
        }

        window.deletePhoto = (key) => {
            if(confirm('Hapus foto ini?')) db.ref('gallery').child(key).remove();
        };

        // ========== FOTO REQUEST ==========
        let currentPhotoReqKey = null;

        function loadPhotoRequests() {
            db.ref('photoRequests').on('value', s => {
                const items = [];
                s.forEach(c => {
                    if(c.val().status === 'pending') items.push({key: c.key, ...c.val()});
                });
                document.getElementById('photoRequestList').innerHTML = items.length === 0
                    ? '<div class="empty-state">Tidak ada permintaan foto</div>'
                    : items.map(r => `
                    <div class="admin-item">
                        <div><strong>${r.title}</strong><br><small style="color: var(--text3);">dari ${r.submitterName}</small></div>
                        <button class="btn btn-primary btn-sm" onclick="previewPhotoReq('${r.key}', '${(r.src||'').replace(/'/g,"\\'")}', '${(r.title||'').replace(/'/g,"\\'")}', '${(r.description||'').replace(/'/g,"\\'")}', '${(r.submitterName||'').replace(/'/g, "\\'")}')" >Preview</button>
                    </div>`).join('');
            });
        }

        window.previewPhotoReq = (key, src, title, desc, submitter) => {
            currentPhotoReqKey = key;
            document.getElementById('photoReqImage').src = src;
            document.getElementById('photoReqTitle').textContent = title;
            document.getElementById('photoReqDesc').textContent = desc || '(Tanpa deskripsi)';
            document.getElementById('photoReqSubmitter').textContent = 'Diajukan oleh: ' + submitter;
            document.getElementById('photoReqModal').style.display = 'flex';
        };

        document.getElementById('closePhotoReqModal').addEventListener('click', () => {
            document.getElementById('photoReqModal').style.display = 'none';
        });

        document.getElementById('approvePhotoReqBtn').addEventListener('click', () => {
            if (!currentPhotoReqKey) return;
            db.ref('photoRequests').child(currentPhotoReqKey).once('value', snap => {
                const data = snap.val();
                db.ref('gallery').push({src: data.src, title: data.title, description: data.description, date: data.date, timestamp: data.timestamp});
                db.ref('photoRequests').child(currentPhotoReqKey).update({status: 'approved'});
                document.getElementById('photoReqModal').style.display = 'none';
                loadPhotoRequests();
            });
        });

        document.getElementById('rejectPhotoReqBtn').addEventListener('click', () => {
            if (!currentPhotoReqKey) return;
            db.ref('photoRequests').child(currentPhotoReqKey).update({status: 'rejected'});
            document.getElementById('photoReqModal').style.display = 'none';
            loadPhotoRequests();
        });

        // ========== PENGUMUMAN ==========
        document.getElementById('addAnnouncementBtn').addEventListener('click', () => {
            const title = document.getElementById('announcementTitle').value.trim();
            const body = document.getElementById('announcementBody').value.trim();
            const priority = document.getElementById('announcementPriority').value;
            if (!title || !body) return alert('Isi semua field');
            
            db.ref('announcements').push({title, body, priority, timestamp: Date.now()}).then(() => {
                document.getElementById('announcementTitle').value = '';
                document.getElementById('announcementBody').value = '';
                loadAnnouncements();
            });
        });

        function loadAnnouncements() {
            db.ref('announcements').on('value', s => {
                const items = [];
                s.forEach(c => items.push({key: c.key, ...c.val()}));
                document.getElementById('announcementList').innerHTML = items.length === 0
                    ? '<div class="empty-state">Belum ada pengumuman</div>'
                    : items.map(a => `
                    <div class="admin-item">
                        <span>${a.title}</span>
                        <button class="btn btn-danger btn-sm" onclick="deleteAnnouncement('${a.key}')">Hapus</button>
                    </div>`).join('');
            });
        }

        window.deleteAnnouncement = (key) => {
            if(confirm('Hapus pengumuman ini?')) db.ref('announcements').child(key).remove();
        };

        // ========== POLLING ==========
        document.getElementById('addOptionBtn').addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'poll-option form-input';
            document.getElementById('pollOptionsContainer').appendChild(input);
        });

        document.getElementById('addPollBtn').addEventListener('click', () => {
            const question = document.getElementById('pollQuestion').value.trim();
            const options = Array.from(document.querySelectorAll('.poll-option')).map(o => o.value.trim()).filter(v => v);
            if (!question || options.length < 2) return alert('Isi pertanyaan dan minimal 2 pilihan');
            
            const pollObj = {question, options: options.reduce((a,o) => ({...a, [o]: 0}), {}), timestamp: Date.now()};
            db.ref('polls').push(pollObj).then(() => {
                document.getElementById('pollQuestion').value = '';
                document.getElementById('pollOptionsContainer').innerHTML = '<input type="text" class="poll-option form-input" placeholder="Pilihan 1"><input type="text" class="poll-option form-input" placeholder="Pilihan 2">';
                loadPolls();
            });
        });

        function loadPolls() {
            db.ref('polls').on('value', s => {
                const items = [];
                s.forEach(c => items.push({key: c.key, ...c.val()}));
                document.getElementById('pollList').innerHTML = items.length === 0
                    ? '<div class="empty-state">Belum ada polling</div>'
                    : items.map(p => `
                    <div class="admin-item">
                        <span>${p.question}</span>
                        <button class="btn btn-danger btn-sm" onclick="deletePoll('${p.key}')">Hapus</button>
                    </div>`).join('');
            });
        }

        window.deletePoll = (key) => {
            if(confirm('Hapus polling ini?')) db.ref('polls').child(key).remove();
        };

        // ========== BADGES ==========
        document.getElementById('openBadgeFormBtn').addEventListener('click', () => {
            document.getElementById('badgeFormModal').style.display = 'flex';
        });

        document.getElementById('closeBadgeFormModal').addEventListener('click', () => {
            document.getElementById('badgeFormModal').style.display = 'none';
        });

        document.getElementById('badgeForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const studentName = document.getElementById('badgeStudentName').value.trim();
            const badgeType = document.getElementById('badgeType').value;
            if (!studentName || !badgeType) return alert('Isi semua field');
            
            db.ref('badges').push({studentName, type: badgeType, timestamp: Date.now()}).then(() => {
                document.getElementById('badgeForm').reset();
                document.getElementById('badgeFormModal').style.display = 'none';
                loadBadges();
            });
        });

        function loadBadges() {
            db.ref('badges').on('value', s => {
                const items = [];
                s.forEach(c => items.push({key: c.key, ...c.val()}));
                document.getElementById('badgeList').innerHTML = items.length === 0
                    ? '<div class="empty-state">Belum ada badge diberikan</div>'
                    : items.map(b => `
                    <div class="admin-item">
                        <span>${b.studentName} • ${getBadgeLabel(b.type)}</span>
                        <button class="btn btn-danger btn-sm" onclick="deleteBadge('${b.key}')">Hapus</button>
                    </div>`).join('');
            });
        }

        function getBadgeLabel(type) {
            const labels = {'best-student': '🏆 Siswa Terbaik','helpful': '🤝 Membantu','funny': '😂 Lucu','smart': '🧠 Pintar','creative': '🎨 Kreatif','leader': '👑 Pemimpin'};
            return labels[type] || type;
        }

        window.deleteBadge = (key) => {
            if(confirm('Hapus badge ini?')) db.ref('badges').child(key).remove();
        };

        // Initialize
        loadPhotos();
        loadPhotoRequests();
        loadAnnouncements();
        loadPolls();
        loadBadges();
        initNavigation();
    </script>

    <style>
        .admin-form-box {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .admin-form-box .form-group:last-child {
            margin-bottom: 0;
        }

        .btn-sm {
            padding: 8px 14px;
            font-size: 12px;
            flex-shrink: 0;
        }
    </style>
</body>
</html>
